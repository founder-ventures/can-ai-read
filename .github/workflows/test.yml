name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  action:
    # Runs the action from this checkout against a real site, to prove the
    # action.yml wiring works on the runner's own Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./
        with:
          url: https://example.com
          pages: 0
          fail: false
      - run: test -n "${{ steps.check.outputs.score }}" && test -f "${{ steps.check.outputs.report-path }}"
